<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chirucat WebUI</title>
	<script>
		/* 在样式生效前定好主题, 避免深色偏好下的白闪。
		   localStorage 的 "chirucat-theme" 由顶栏主题按钮写入, 三态:
		     "auto"            跟随系统 (默认)
		     "light" / "dark"  手动指定
		   这里同时写两个标记, 分工不同:
		     data-theme-mode  用户选的模式 → 决定顶栏显示哪个图标
		     data-theme       "dark" 或不存在 → 决定实际配色
		   放在 <head> 且同步执行, 才能早于首屏绘制。 */
		(() => {
			try {
				const saved = localStorage.getItem("chirucat-theme");
				const mode = (saved === "light" || saved === "dark") ? saved : "auto";
				document.documentElement.dataset.themeMode = mode;

				const dark = mode === "dark"
					|| (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
				if (dark) document.documentElement.dataset.theme = "dark";
			} catch {
				/* localStorage 不可用 (隐私模式等): 按跟随系统处理, 不阻塞页面 */
				document.documentElement.dataset.themeMode = "auto";
			}
		})();
	</script>
	<link rel="stylesheet" href="css/themes/default.css">
	<link rel="stylesheet" href="css/themes/dark.css">
	<link rel="stylesheet" href="css/layout.css">
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/components/dialog.css">
	<link rel="stylesheet" href="css/components/dot-switch.css">
	<link rel="stylesheet" href="css/components/config-editor.css">
	<link rel="stylesheet" href="css/components/charts.css">
	<link rel="stylesheet" href="css/components/tooltip.css">
	<link rel="stylesheet" href="css/overlay.css">
	<link rel="stylesheet" href="css/toast.css">
</head>

<body class="auth-pending nav-collapsed">
	<header id="top-nav">
		<span class="brand">=^ - ^= WebUI</span>

		<!-- 主题切换。三个图标对应三种模式, 只显示当前那一个:
		     半圆=跟随系统, 太阳=浅色, 月亮=深色 -->
		<button id="theme-toggle" class="icon-btn" type="button" aria-label="切换主题">
			<svg class="theme-icon theme-icon-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<circle cx="12" cy="12" r="9" />
				<path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" />
			</svg>
			<svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<circle cx="12" cy="12" r="4" />
				<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
			</svg>
			<svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
			</svg>
		</button>
	</header>

	<!-- 活动栏: 一级导航, 由 SPA 框架根据注册的页面自动生成 -->
	<nav id="activity-bar" aria-label="主导航"></nav>

	<!-- 二级侧栏 (#side-bar) 与配套的窄屏汉堡按钮 (#nav-toggle) 当前停用:
	     bot 管理是以弹窗形式呈现的, 接不进二级菜单。
	     相关 CSS (layout.css 末尾的抽屉规则) 与框架能力
	     (framework.js 的 renderSidebar) 都保留着 — 需要时把 <aside> 加回,
	     并把 layout.css 的 grid 改回三列即可。 -->

	<div id="main">
		<!-- 页面内容渲染目标: SPA 框架把当前页面渲染到这里 -->
		<div id="page-view"></div>
		<noscript>
			<p>需要启用 JavaScript 才能使用 WebUI</p>
		</noscript>
		<script type="module" src="/app.js"></script>
	</div>

	<!-- 登录卡片: 鉴权失败/过期时显示, 登录成功后隐藏 (由 app.js 控制) -->
	<div id="login-view" hidden>
		<form id="login-form" class="login-card">
			<img class="login-logo" src="/img/chirucat.svg" alt="Chirucat logo" />
			<h1 class="login-title">WebUI</h1>
			<p class="login-subtitle">请输入访问密码</p>
			<input id="login-password" class="input" type="password" placeholder="密码" autocomplete="current-password" required />
			<button id="login-submit" class="btn primary" type="submit">登 录</button>
			<p id="login-error" class="login-error" hidden></p>
		</form>
	</div>
</body>

</html>
